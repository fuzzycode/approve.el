# Eldoc details of a person (F20, D29): what the store lacks.  The email is
# empty unless the user made it public.
query UserDetails($login: String!) {
  user(login: $login) {
    __typename
    id
    login
    name
    pronouns
    email
    bio
    company
    location
    websiteUrl
    url
    status {
      __typename
      id
      emoji
      message
      indicatesLimitedAvailability
    }
  }
  rateLimit {
    cost
    remaining
    resetAt
  }
}
