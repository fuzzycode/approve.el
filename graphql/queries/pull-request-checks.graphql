# Checks detail (F16, loaded lazily): the check runs and statuses of the
# PR's status rollup (its head commit's), 100 per page.  The core query
# selects the same StatusCheckRollup with the contextCounts alias, so
# this never replaces those counts.
query PullRequestChecks($owner: String!, $name: String!, $number: Int!, $after: String) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      __typename
      id
      statusCheckRollup {
        __typename
        id
        state
        contexts(first: 100, after: $after) {
          totalCount
          pageInfo {
            hasNextPage
            endCursor
          }
          nodes {
            __typename
            ...CheckRunFields
            ...StatusContextFields
          }
        }
      }
    }
  }
  rateLimit {
    cost
    remaining
    resetAt
  }
}
