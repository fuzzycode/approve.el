# F09: submit the viewer's pending review as Approve, Request changes or
# Comment.  It takes the pull request's id alone (D32); without a body, a body
# the review was made with stays.  The answer is the review, with its
# comments (no longer pending), and the PR's review state.
mutation SubmitPullRequestReview(
  $pullRequestId: ID!
  $event: PullRequestReviewEvent!
  $body: String
) {
  submitPullRequestReview(input: {pullRequestId: $pullRequestId, event: $event, body: $body}) {
    pullRequestReview {
      ...PullRequestReviewFields
      comments(first: 100) {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...PullRequestReviewCommentFields
        }
      }
      pullRequest {
        __typename
        id
        ...PullRequestReviewStateFields
      }
    }
  }
}
