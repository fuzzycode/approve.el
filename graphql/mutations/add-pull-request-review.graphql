${include:fragments/pull-request-review-state.graphql}

# F05 and F09 when no review is pending: a single comment (event COMMENT with
# threads on lines), or a verdict with a body.  Without an event the review
# stays pending.  GitHub refuses it while the viewer has a pending review
# (D32).  The answer has no thread ids, so it asks for the PR's last
# $threadCount threads (addedThreads; they come in the order they were
# made), of which approve-mutations.el keeps those of this review.
mutation AddPullRequestReview(
  $pullRequestId: ID!
  $event: PullRequestReviewEvent
  $body: String
  $threads: [DraftPullRequestReviewThread!]
  $threadCount: Int!
) {
  addPullRequestReview(
    input: {pullRequestId: $pullRequestId, event: $event, body: $body, threads: $threads}
  ) {
    pullRequestReview {
      ...PullRequestReviewFields
      pullRequest {
        __typename
        id
        ...PullRequestReviewStateFields
        addedThreads: reviewThreads(last: $threadCount) {
          nodes {
            ...PullRequestReviewThreadFields
          }
        }
      }
    }
  }
}
