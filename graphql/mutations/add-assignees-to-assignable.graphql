${include:fragments/user.graphql}

# F12: assign people to the pull request.  The answer is its assignees, all
# of them.
mutation AddAssigneesToAssignable($assignableId: ID!, $assigneeIds: [ID!]!) {
  addAssigneesToAssignable(input: {assignableId: $assignableId, assigneeIds: $assigneeIds}) {
    assignable {
      __typename
      ... on PullRequest {
        id
        assignees(first: 100) {
          nodes {
            ...UserFields
          }
        }
      }
    }
  }
}
