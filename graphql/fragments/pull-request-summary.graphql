${include:fragments/actor.graphql}

# A pull request as a row of the lists, the dashboard's and the search's:
# what approve-list.el draws (state, number, title, repository, author,
# last update, checks, review decision) and what a row tells about itself
# in eldoc's echo line (the author's role, its branches, size and
# discussion).  The lists keep search results as GitHub sends them; they
# never go into a store.  The counts are aliased, as the PR's own lists
# keep their plain names for their pages (graphql/README.org).
fragment PullRequestSummaryFields on PullRequest {
  __typename
  id
  number
  url
  title
  state
  isDraft
  createdAt
  updatedAt
  author {
    ...ActorFields
  }
  authorAssociation
  repository {
    __typename
    id
    nameWithOwner
    url
  }
  baseRefName
  headRefName
  additions
  deletions
  changedFiles
  commentCount: comments {
    totalCount
  }
  threadCount: reviewThreads {
    totalCount
  }
  reviewDecision
  statusCheckRollup {
    __typename
    id
    state
  }
}
