${include:fragments/actor.graphql}
${include:fragments/reaction-group.graphql}

# A review: its verdict, body and how many code comments it has.  The count
# is aliased (commentCount) because the pending review selects the plain
# comments list (store contract: one response name per shape).  The commit
# a review was made on is selected only for the viewer's latest review
# (PullRequestReviewStateFields): in the timeline, a nullable review commit
# would clash with PullRequestCommit's non-null commit.
fragment PullRequestReviewFields on PullRequestReview {
  __typename
  id
  url
  author {
    ...ActorFields
  }
  authorAssociation
  state
  body
  bodyHTML
  createdAt
  submittedAt
  lastEditedAt
  includesCreatedEdit
  isMinimized
  minimizedReason
  commentCount: comments {
    totalCount
  }
  viewerDidAuthor
  viewerCanUpdate
  viewerCanDelete
  viewerCanReact
  viewerCanMinimize
  viewerCanUnminimize
  reactionGroups {
    ...ReactionGroupFields
  }
}
