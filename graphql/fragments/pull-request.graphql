${include:fragments/actor.graphql}
${include:fragments/user.graphql}
${include:fragments/label.graphql}
${include:fragments/milestone.graphql}
${include:fragments/ref.graphql}
${include:fragments/reaction-group.graphql}
${include:fragments/pull-request-review-state.graphql}

# The PR core: what the header, metadata rows, status line, description,
# header line and "Your pending review" show, and the reviewers GitHub
# suggests, whom the reviewers picker offers first (F12).  The review state
# has a fragment of its own, which the review mutations select too.  The long
# lists (files, threads, timeline, commits, check contexts) come from their
# own queries; here they are only counted, under aliases, so loading this
# never replaces a list another query loaded (store contract point 3).
fragment PullRequestFields on PullRequest {
  __typename
  id
  number
  url
  title
  state
  isDraft
  locked
  activeLockReason
  createdAt
  updatedAt
  closed
  closedAt
  merged
  mergedAt
  mergedBy {
    ...ActorFields
  }
  author {
    ...ActorFields
  }
  authorAssociation
  body
  bodyHTML
  lastEditedAt
  includesCreatedEdit
  baseRefName
  baseRefOid
  headRefName
  headRefOid
  isCrossRepository
  baseRef {
    ...RefFields
  }
  headRef {
    ...RefFields
  }
  headRepositoryOwner {
    ...ActorFields
  }
  headRepository {
    __typename
    id
    nameWithOwner
    url
  }
  additions
  deletions
  changedFiles
  commitCount: commits {
    totalCount
  }
  threadCount: reviewThreads {
    totalCount
  }
  labels(first: 100) {
    nodes {
      ...LabelFields
    }
  }
  assignees(first: 100) {
    nodes {
      ...UserFields
    }
  }
  milestone {
    ...MilestoneFields
  }
  ...PullRequestReviewStateFields
  suggestedReviewers {
    isAuthor
    isCommenter
    reviewer {
      ...UserFields
    }
  }
  mergeable
  mergeStateStatus
  statusCheckRollup {
    __typename
    id
    state
    contextCounts: contexts {
      checkRunCount
      checkRunCountsByState {
        state
        count
      }
      statusContextCount
      statusContextCountsByState {
        state
        count
      }
    }
  }
  closingIssuesReferences(first: 10) {
    nodes {
      __typename
      id
      number
      title
      state
      url
    }
  }
  reactionGroups {
    ...ReactionGroupFields
  }
  viewerDidAuthor
  viewerSubscription
  viewerCanUpdate
  viewerCanReact
  viewerCanSubscribe
  viewerCanLabel
  viewerCanAssign
  viewerCanClose
  viewerCanReopen
  viewerCanApplySuggestion
  viewerCanEditFiles
  viewerCanUpdateBranch
  viewerCanDeleteHeadRef
  viewerCanEnableAutoMerge
  viewerCanDisableAutoMerge
  viewerCanMergeAsAdmin
}
